name: AutoLog CI/CD Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-tests:
    name: Security Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit pytest pytest-flask

      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-43012

      - name: Static security analysis (Bandit)
        run: bandit -r app/ -ll -x app/tests

      - name: Run unit tests (pytest)
        run: pytest tests/ -v
